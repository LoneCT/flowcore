spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flowcore_user
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: flowcore-user-pool-local
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      password: ${REDIS_PASSWORD}

  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    io.github.lonect.flowcore.user: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG